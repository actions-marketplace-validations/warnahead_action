name: deploy-site

# Deploys site/ to Cloudflare Pages project warnahead. While this repository is private every
# deploy goes to the preview alias (preview.warnahead.pages.dev, noindex); once it is public,
# to production (warnahead.pages.dev). Then checks that the host serves this commit's data bytes.

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ${{ github.event.repository.private && 'preview' || 'main' }}
      SITE_URL: ${{ github.event.repository.private && 'https://preview.warnahead.pages.dev' || 'https://warnahead.pages.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: No site on this ref
        if: hashFiles('site/index.html') == ''
        run: echo "no site/index.html yet; nothing to deploy"
      - name: Deploy site/ to Cloudflare Pages
        if: hashFiles('site/index.html') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.161.0 pages deploy site --project-name warnahead --branch "$BRANCH" --commit-hash "$GITHUB_SHA"
      - name: Check the served data bytes
        if: hashFiles('site/index.html') != ''
        run: node .github/scripts/verify-deploy.mjs "$SITE_URL"
